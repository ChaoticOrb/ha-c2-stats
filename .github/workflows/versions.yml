name: Versions

# Catches a release tag that doesn't match manifest.json, and a manifest and
# card version that have drifted apart. On a release, a failure here means
# the published version is wrong: GitHub emails you about the failed run.

on:
  release:
    types: [published]
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Check versions match
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: python .github/scripts/check_versions.py
