<!doctype html>
<!--
  Standalone preview of the Concept2 Logbook card with mock data.
  Serve the repo root (python3 -m http.server) and open /dev/card-preview.html.
  ha-card and ha-icon are stubbed; colours mimic Home Assistant's default themes.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card preview</title>
<style>
  body { margin: 0; font-family: Roboto, "Segoe UI", system-ui, sans-serif; background: #e9e9e9; }
  .row { display: flex; gap: 24px; padding: 24px; flex-wrap: wrap; align-items: flex-start; }
  .theme { padding: 20px; border-radius: 12px; }
  .light { background: #fafafa;
    --primary-color: #03a9f4; --accent-color: #ff9800; --primary-text-color: #212121;
    --secondary-text-color: #727272; --card-background-color: #fff; --divider-color: rgba(0,0,0,.12);
    --secondary-background-color: #f2f2f2; --success-color: #43a047; --warning-color: #e08600; --text-primary-color: #fff; }
  .dark { background: #111111;
    --primary-color: #03a9f4; --accent-color: #ff9800; --primary-text-color: #e1e1e1;
    --secondary-text-color: #9b9b9b; --card-background-color: #1c1c1c; --divider-color: rgba(225,225,225,.12);
    --secondary-background-color: #282828; --success-color: #66bb6a; --warning-color: #ffa600; --text-primary-color: #fff; }
  .slot { width: 380px; }
  .slot.wide { width: 520px; }
  h2 { font: 500 13px system-ui; color: #666; margin: 0 0 8px; }
</style>
<script>
  // Minimal stand-ins for Home Assistant's elements.
  customElements.define("ha-card", class extends HTMLElement {
    constructor() {
      super();
      this.attachShadow({ mode: "open" }).innerHTML =
        `<style>:host{display:block;background:var(--card-background-color);border-radius:12px;
         border:1px solid var(--divider-color);color:var(--primary-text-color)}</style><slot></slot>`;
    }
  });
  const ICONS = { "mdi:fire": "🔥", "mdi:calendar-check": "✓", "mdi:rowing": "🚣", "mdi:calendar-clock": "⏱" };
  customElements.define("ha-icon", class extends HTMLElement {
    connectedCallback() { this.textContent = ICONS[this.getAttribute("icon")] || "•"; this.style.fontSize = "12px"; }
  });
</script>
<script type="module" src="../custom_components/concept2_logbook/frontend/concept2-logbook-card.js"></script>
</head>
<body>
<div class="row" id="root"></div>
<script type="module">
  await customElements.whenDefined("concept2-logbook-card");
  const now = new Date();
  const iso = (daysAgo) => { const d = new Date(now); d.setDate(d.getDate() - daysAgo); return d.toISOString(); };

  const states = {}, entities = {};
  const add = (key, state, attributes = {}) => {
    const entity_id = `sensor.concept2_test_${key}`;
    states[entity_id] = { entity_id, state: String(state), attributes, last_updated: now.toISOString() };
    entities[entity_id] = { entity_id, platform: "concept2_logbook", device_id: "dev1", translation_key: key };
  };
  add("lifetime_distance", 1811594, { statistic_id: "concept2_logbook:distance_42" });
  add("season_distance", 284310);
  add("month_distance", 41250);
  add("week_distance", 18400);
  add("week_count", 3);
  add("current_daily_streak", 2);
  add("longest_daily_streak", 11);
  add("current_weekly_streak", 14);
  add("longest_weekly_streak", 31);
  add("days_since_last_workout", 0);
  const pb = (event, kind, target, state, pace, daysAgo, sb) =>
    add(`rower_pb_${target}${kind === "distance" ? "m" : "min"}`, state, {
      machine: "rower", event, event_kind: kind, event_target: target, pace, date: iso(daysAgo),
      season_best_time: sb?.time ?? null, season_best_distance_m: sb?.dist ?? null, season_best_date: sb ? iso(20) : null,
    });
  pb("500m", "distance", 500, "1:38.4", "1:38.4", 400, { time: "1:41.0" });
  pb("2k", "distance", 2000, "7:12.6", "1:48.1", 30);
  pb("5k", "distance", 5000, "19:02.3", "1:54.2", 700, { time: "19:30.8" });
  pb("10k", "distance", 10000, "39:58.0", "1:59.9", 800);
  pb("30 min", "time", 30, 7612, "1:58.2", 12);

  // Mock daily history: mostly rowing 4 to 5 days a week, with today's row.
  const callWS = async (msg) => {
    const start = new Date(msg.start_time);
    const rows = [];
    for (let d = new Date(start); d <= now; d.setDate(d.getDate() + 1)) {
      const dow = d.getDay(), seed = (d.getDate() * 37 + d.getMonth() * 11) % 100;
      if ((dow === 0 || dow === 3) && seed < 70) continue;
      if (seed < 18) continue;
      rows.push({ start: d.getTime(), change: 4000 + ((seed * 131) % 9000) });
    }
    return { [msg.statistic_ids[0]]: rows };
  };
  const hass = { states, entities, callWS, locale: { language: "en-GB" } };

  const variants = [
    ["Light · goals set", "light", "", { weekly_goal: 30000, season_goal: 1000000 }],
    ["Dark · goals set", "dark", "", { weekly_goal: 30000, season_goal: 1000000 }],
    ["Light · no goals, 14 days, wide", "light", "wide", { chart_days: 14 }],
  ];
  const root = document.getElementById("root");
  for (const [label, theme, width, extra] of variants) {
    const wrap = document.createElement("div");
    wrap.className = `theme ${theme}`;
    wrap.innerHTML = `<h2>${label}</h2><div class="slot ${width}"></div>`;
    const card = document.createElement("concept2-logbook-card");
    card.setConfig({ type: "custom:concept2-logbook-card", ...extra });
    card.hass = hass;
    wrap.querySelector(".slot").appendChild(card);
    root.appendChild(wrap);
  }
  window.previewReady = true;
</script>
</body>
</html>
